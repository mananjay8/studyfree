<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Study Quiz</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="app">

    <header>
      <h1>Study Quiz</h1>
      <p id="quizInfo">Practice Quiz</p>
    </header>

    <main class="quiz-card">

      <div class="top">
        <span id="questionNumber">Question 1</span>
        <span id="score">Score: 0</span>
      </div>

      <h2 id="question">
        Question yahan aayega
      </h2>

      <div id="options"></div>

      <div id="explanation" class="explanation"></div>

      <button id="nextBtn" class="next-btn" hidden>
        Next Question
      </button>

    </main>

  </div>

  <script src="script.js"></script>

</body>
</html>
